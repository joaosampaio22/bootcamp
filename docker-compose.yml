name: estudo-em-dia

x-postgres: &postgres
  image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 2s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Execute npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup:env}
      POSTGRES_DB: ${POSTGRES_DB:?Execute npm run setup:env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  db-test:
    <<: *postgres
    profiles: [test]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Execute npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup:env}
      POSTGRES_DB: estudo_em_dia_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data

  db-demo:
    <<: *postgres
    profiles: [demo]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Execute npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup:env}
      POSTGRES_DB: estudo_em_dia_demo
    ports:
      - "127.0.0.1:${POSTGRES_DEMO_PORT:-5434}:5432"
    volumes:
      - postgres-demo-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  postgres-demo-data:
